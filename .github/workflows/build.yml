name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same as a local build: make runs the pinned devkitA64 container from the Makefile.
      - name: Build and package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: SMOInterp
          path: SMOInterp-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SMOInterp-*.zip
          generate_release_notes: true
